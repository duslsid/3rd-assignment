<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>RUNNERS | 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="headerSlot"></div>

  <main>
    <div class="login-wrap">
      <div class="login-card">
        <p class="login-label font-pname">아이디</p>
        <input type="text" class="login-input" id="loginId" autocomplete="username">

        <div class="gap-20"></div>

        <p class="login-label font-pname">비밀번호</p>
        <input type="password" class="login-input" id="loginPw" autocomplete="current-password">

        <div class="gap-30"></div>

        <label class="login-remember">
          <input type="checkbox" id="rememberId">
          <span class="font-pname">아이디 기억하기</span>
        </label>

        <div class="login-buttons">
          <button type="button" class="font-promo" id="btnLogin">로그인</button>
          <button type="button" class="font-promo" id="btnSignup">회원가입</button>
        </div>
      </div>

      <div class="login-find">
        <button type="button" class="font-price" id="btnFindId">아이디 찾기</button>
        <span class="bar font-price">ㅣ</span>
        <button type="button" class="font-price" id="btnFindPw">비밀번호 찾기</button>
      </div>

      <p class="login-msg font-price" id="loginMsg"></p>
    </div>
  </main>

  <div id="footerSlot"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
