<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>RUNNERS | 마이페이지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=East+Sea+Dokdo&family=Noto+Sans+KR:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="headerSlot"></div>

  <main>
    <div class="mypage">
      <h2 class="font-content mypage-name" id="myName">고객님</h2>
      <div class="mypage-box">
        <!-- 박스 상단 메뉴 : 클릭하면 아래 영역에 내용이 나온다 -->
        <div class="mypage-menu">
          <button type="button" class="mypage-tab on" data-tab="point">쿠폰/포인트</button>
          <button type="button" class="mypage-tab" data-tab="wish">위시리스트</button>
          <button type="button" class="mypage-tab" data-tab="cart">장바구니</button>
          <button type="button" class="mypage-tab" data-tab="orders">주문/배송조회</button>
        </div>
        <div class="mypage-panel" id="mypagePanel"></div>
      </div>
    </div>
  </main>

  <div id="footerSlot"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/common.js"></script>
  <script src="js/mypage.js"></script>
</body>
</html>
